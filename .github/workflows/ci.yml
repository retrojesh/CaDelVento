name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build di produzione
        run: npm run build
